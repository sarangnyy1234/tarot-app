<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>사랑타로 🔮</title><meta name="theme-color" content="#24113d">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#f7efff;background:radial-gradient(circle at 20% 0,#5b2b82 0,#24113d 35%,#0e0719 100%);min-height:100vh}
header{padding:28px 18px;text-align:center;border-bottom:1px solid #ffffff20}.brand{font-size:30px;font-weight:800}.sub{opacity:.78;margin-top:6px}
nav{display:flex;gap:8px;overflow:auto;padding:14px;position:sticky;top:0;background:#120a20e8;backdrop-filter:blur(12px);z-index:4;justify-content:center}
button,.pill{border:1px solid #b88cff55;background:#ffffff10;color:#fff;border-radius:999px;padding:10px 15px;cursor:pointer;white-space:nowrap}button.active,.primary{background:linear-gradient(135deg,#8d5cff,#d25cff);border:0;font-weight:700}
main{max-width:1120px;margin:auto;padding:20px}.hero{text-align:center;padding:22px}.hero h1{margin:0 0 8px;font-size:clamp(26px,5vw,44px)}
.panel{background:#ffffff0c;border:1px solid #ffffff1f;border-radius:22px;padding:20px;box-shadow:0 18px 50px #0005}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}.card{perspective:900px}.face{min-height:310px;border-radius:18px;padding:16px;border:1px solid #e9d5ff55;background:linear-gradient(155deg,#351c54,#171025);box-shadow:0 12px 28px #0007;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center}
.symbol{font-size:76px;filter:drop-shadow(0 0 18px #d9a7ff88)}.name{font-size:19px;font-weight:800}.en{font-size:12px;opacity:.65}.rev{transform:rotate(180deg)}.tag{font-size:12px;padding:5px 9px;border-radius:999px;background:#ffffff15}
.reading{margin-top:18px;display:grid;gap:12px}.reading article{background:#ffffff0a;border-radius:15px;padding:15px;border-left:3px solid #b777ff}.reading h3{margin:0 0 8px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:10px}.mini{padding:13px;border-radius:14px;background:#ffffff0b;border:1px solid #ffffff17;text-align:center;cursor:pointer}.mini .ico{font-size:35px}.mini small{opacity:.65}
.months{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.muted{opacity:.68;font-size:13px}.hidden{display:none!important}
footer{text-align:center;padding:30px 18px;opacity:.6;font-size:12px}@media(max-width:600px){nav{justify-content:flex-start}.face{min-height:270px}}
</style></head><body>
<header><div class="brand">✦ 사랑타로 ✦</div><div class="sub">카드가 건네는 상징을 통해 오늘의 마음을 들여다보세요</div></header>
<nav id="tabs"></nav><main><section class="hero"><h1 id="title">오늘의 운세</h1><p id="desc">세 장의 카드로 오늘의 흐름과 조언을 살펴봅니다.</p></section><section class="panel" id="app"></section></main>
<footer>🔮 타로 해석은 오락 및 자기성찰을 위한 콘텐츠입니다. 의료·법률·재정 등 중요한 결정을 대신하지 않습니다.</footer>
<script>
const majors=[
["바보","The Fool","🌬️","새로운 시작, 자유, 가능성","충동보다 호기심을 지혜롭게 활용하세요."],
["마법사","The Magician","✨","실행력, 재능, 창조","가진 자원을 한곳에 집중하세요."],
["여사제","The High Priestess","🌙","직관, 내면, 통찰","서두르지 말고 숨은 맥락을 살피세요."],
["여황제","The Empress","🌷","풍요, 돌봄, 성장","돌봄과 자기관리의 균형을 잡으세요."],
["황제","The Emperor","👑","질서, 책임, 안정","통제보다 명확한 기준을 세우세요."],
["교황","The Hierophant","🗝️","전통, 배움, 조언","관습을 따르되 스스로 납득해 보세요."],
["연인","The Lovers","💞","관계, 선택, 조화","가치관에 맞는 선택인지 확인하세요."],
["전차","The Chariot","🏇","의지, 전진, 승리","속도와 방향을 함께 점검하세요."],
["힘","Strength","🦁","용기, 인내, 자제","강압보다 부드러운 끈기를 택하세요."],
["은둔자","The Hermit","🏮","성찰, 탐색, 지혜","혼자 생각한 뒤 필요한 대화는 이어가세요."],
["운명의 수레바퀴","Wheel of Fortune","🎡","변화, 전환, 기회","변화에 유연하게 대응하세요."],
["정의","Justice","⚖️","균형, 책임, 판단","감정과 사실을 구분해 판단하세요."],
["매달린 남자","The Hanged Man","🔻","멈춤, 관점 전환, 수용","억지로 밀기보다 다른 관점을 보세요."],
["죽음","Death","🦋","끝맺음, 전환, 재생","놓아야 할 것을 정리해 새 공간을 만드세요."],
["절제","Temperance","🏺","조화, 절제, 회복","극단보다 지속 가능한 속도를 택하세요."],
["악마","The Devil","⛓️","집착, 욕망, 속박","습관과 의존이 선택을 대신하는지 살피세요."],
["탑","The Tower","⚡","급변, 깨달음, 재구성","흔들림 속에서 안전과 핵심부터 지키세요."],
["별","The Star","⭐","희망, 치유, 영감","기대와 현실적 행동을 연결하세요."],
["달","The Moon","🌙","불확실성, 감정, 상상","추측을 사실처럼 단정하지 마세요."],
["태양","The Sun","☀️","성공, 활력, 자신감","낙관 속에서도 주변의 의견을 확인하세요."],
["심판","Judgement","📯","각성, 결단, 재평가","과거를 교훈으로 삼고 결정을 실행하세요."],
["세계","The World","🌍","완성, 성취, 통합","마무리를 축하하고 다음 단계도 준비하세요."]
];
const suits=[
["완드","Wands","🔥","열정·행동·창의"],
["컵","Cups","💧","감정·관계·공감"],
["소드","Swords","⚔️","사고·결단·갈등"],
["펜타클","Pentacles","🪙","현실·자원·안정"]
];
const ranks=[["에이스","Ace","시작"],["2","Two","균형"],["3","Three","확장"],["4","Four","기반"],["5","Five","도전"],["6","Six","회복"],["7","Seven","점검"],["8","Eight","진전"],["9","Nine","성숙"],["10","Ten","완성"],["페이지","Page","소식"],["나이트","Knight","추진"],["퀸","Queen","수용"],["킹","King","통솔"]];
let deck=majors.map((x,i)=>({ko:x[0],en:x[1],icon:x[2],key:x[3],advice:x[4],group:"메이저 아르카나"}));
suits.forEach(s=>ranks.forEach(r=>deck.push({ko:s[0]+" "+r[0],en:r[1]+" of "+s[1],icon:s[2],key:s[3]+" · "+r[2],advice:r[2]+"의 에너지를 "+s[0]+" 영역에서 균형 있게 활용하세요.",group:s[0]})));
const tabs=[["daily","오늘의 운세"],["weekly","주간 운세"],["yearly","연간 운세"],["total","총 운세"],["gallery","카드 도감"],["saved","마이 타로"]];
let mode="daily", reverse=true;
const $=s=>document.querySelector(s), shuffle=a=>[...a].sort(()=>Math.random()-.5);
function nav(){ $("#tabs").innerHTML=tabs.map(t=>'<button class="'+(mode===t[0]?'active':'')+'" onclick="mode=\''+t[0]+'\';render()">'+t[1]+'</button>').join("")}
function pick(n){return shuffle(deck).slice(0,n).map(c=>({...c,rev:reverse&&Math.random()<.28}))}
function meaning(c){return c.rev?"정방향의 에너지가 지연되거나 내면화되는 시기입니다. "+c.advice:c.key+"의 흐름이 강조됩니다. "+c.advice}
function card(c,label=""){return '<div class="card"><div class="face '+(c.rev?'rev':'')+'"><span class="tag">'+(label||c.group)+'</span><div class="symbol">'+c.icon+'</div><div><div class="name">'+c.ko+'</div><div class="en">'+c.en+'</div></div><span class="tag">'+(c.rev?'역방향':'정방향')+'</span></div></div>'}
function details(cs){return '<div class="reading">'+cs.map((c,i)=>'<article><h3>'+c.icon+' '+c.ko+' · '+(c.rev?'역방향':'정방향')+'</h3><b>의미</b> '+c.key+'<br><br><b>해석</b> '+meaning(c)+'<br><br><b>좋은 점</b> '+(c.rev?'숨은 문제를 인식하고 조정할 기회가 생깁니다.':'카드의 강점을 적극적으로 활용하기 좋은 흐름입니다.')+'<br><br><b>보완할 점</b> '+c.advice+'</article>').join("")+'</div>'}
function save(cs,type){localStorage.setItem("tarotLast",JSON.stringify({date:new Date().toLocaleString("ko-KR"),type,cards:cs}));alert("마이 타로에 저장했어요 ✨")}
function draw(n,labels,type){const cs=pick(n);$("#result").innerHTML='<div class="cards">'+cs.map((c,i)=>card(c,labels[i]||"")).join("")+'</div>'+details(cs)+'<div class="controls"><button onclick=\'save(window.lastCards,"'+type+'")\'>💜 결과 저장</button></div>';window.lastCards=cs}
function standard(title,desc,n,labels){$("#title").textContent=title;$("#desc").textContent=desc;$("#app").innerHTML='<div class="controls"><button class="primary" onclick=\'draw('+n+','+JSON.stringify(labels)+',"'+title+'")\'>🔮 카드 뽑기</button><label class="pill"><input type="checkbox" '+(reverse?'checked':'')+' onchange="reverse=this.checked"> 역방향 포함</label></div><div id="result"><p style="text-align:center" class="muted">마음을 가다듬고 카드 뽑기를 눌러주세요.</p></div>'}
function render(){nav();
if(mode==="daily")standard("오늘의 운세","현재의 흐름 · 기회 · 오늘의 조언을 세 장으로 읽습니다.",3,["현재의 흐름","오늘의 기회","오늘의 조언"]);
if(mode==="weekly")standard("주간 운세","이번 주의 시작 · 중심 · 마무리 흐름을 살펴봅니다.",3,["주초","주중","주말"]);
if(mode==="total")standard("총 운세","전체 · 연애 · 금전 · 직장/학업 · 대인관계의 흐름을 살펴봅니다.",5,["전체운","연애운","금전운","직장/학업운","대인관계운"]);
if(mode==="yearly"){$("#title").textContent="연간 운세";$("#desc").textContent="12장의 카드로 한 해의 월별 흐름을 살펴봅니다.";$("#app").innerHTML='<div class="controls"><button class="primary" onclick="year()">✨ 12개월 카드 뽑기</button></div><div id="result"></div>'}
if(mode==="gallery"){$("#title").textContent="78장 카드 도감";$("#desc").textContent="메이저 22장과 마이너 56장의 상징과 핵심 의미를 확인하세요.";$("#app").innerHTML='<div class="gallery">'+deck.map(c=>'<div class="mini" onclick=\'alert("'+c.ko+'\\n\\n'+c.key+'\\n'+c.advice+'")\'><div class="ico">'+c.icon+'</div><b>'+c.ko+'</b><br><small>'+c.en+'</small></div>').join("")+'</div>'}
if(mode==="saved"){$("#title").textContent="마이 타로";$("#desc").textContent="최근 저장한 리딩을 다시 확인합니다.";let s=localStorage.getItem("tarotLast");$("#app").innerHTML=s?(()=>{let x=JSON.parse(s);return '<h3>'+x.type+' <span class="muted">'+x.date+'</span></h3><div class="cards">'+x.cards.map(c=>card(c)).join("")+'</div>'+details(x.cards)})():'<p style="text-align:center">아직 저장한 리딩이 없습니다.</p>'}}
function year(){let cs=pick(12),ms=["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];$("#result").innerHTML='<div class="months">'+cs.map((c,i)=>'<div class="mini"><b>'+ms[i]+'</b><div class="ico">'+c.icon+'</div>'+c.ko+'<br><small>'+c.key+'</small></div>').join("")+'</div>'+details(cs);window.lastCards=cs}
render();
</script></body></html>
